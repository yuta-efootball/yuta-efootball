<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#101216">
  <meta name="app-version" content="v1.1">
  <title>eFootball タレントデザイン シミュレーター</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="app-header">
    <div class="brand">
      <div class="brand-mark">TD</div>
      <div>
        <h1>タレントデザイン</h1>
        <p>eFootball 育成シミュレーター</p>
      </div>
    </div>
    <button id="resetBtn" class="secondary-btn">配分をリセット</button>
  </header>

  <main class="app-shell">
    <section class="panel search-panel">
      <label for="playerSearch">選手検索</label>
      <div class="search-wrap">
        <input id="playerSearch" type="search" placeholder="選手名を入力（例：クヴァ）" autocomplete="off">
        <div id="searchResults" class="search-results hidden"></div>
      </div>
      <div id="playerSummary" class="player-summary empty">選手を選択してください</div>
    </section>

    <section class="panel control-panel">
      <div class="control-grid">
        <label class="field">
          <span>監督</span>
          <select id="coachSelect"><option value="">未選択</option></select>
        </label>
        <label class="field">
          <span>監督適性</span>
          <select id="aptitudeSelect"><option value="">未選択</option></select>
        </label>
        <label class="field">
          <span>ライブアップデート</span>
          <div class="segmented" id="liveLinks">
            <button type="button" data-live="A">A</button>
            <button type="button" data-live="B">B</button>
            <button type="button" data-live="C">C</button>
          </div>
        </label>
        <div class="control-note">
          <span>計算順</span>
          <strong>選手側ブースター → 上限 → 監督適性 → 監督ブースター</strong>
        </div>
      </div>

      <div class="subsection">
        <div class="subsection-title">選手ブースター</div>
        <div class="booster-grid">
          <div class="booster-slot">
            <label class="field"><span>通常ブースター①</span><select class="booster-select" data-slot="0"></select></label>
            <div class="booster-value-field"><div class="segmented booster-value-buttons" data-normal-values="0">
              <button type="button" data-normal-value="1">+1</button><button type="button" data-normal-value="2">+2</button><button type="button" data-normal-value="3">+3</button><button type="button" data-normal-value="4">+4</button>
            </div></div>
          </div>
          <div class="booster-slot">
            <label class="field"><span>通常ブースター②</span><select class="booster-select" data-slot="1"></select></label>
            <div class="booster-value-field"><div class="segmented booster-value-buttons" data-normal-values="1">
              <button type="button" data-normal-value="1">+1</button><button type="button" data-normal-value="2">+2</button><button type="button" data-normal-value="3">+3</button><button type="button" data-normal-value="4">+4</button>
            </div></div>
          </div>
          <div class="booster-slot additional-slot">
            <label class="field"><span>追加ブースター</span><select id="additionalBooster"></select></label>
            <div class="booster-value-field"><div class="segmented booster-value-buttons" id="additionalValue">
              <button type="button" data-add-value="1">+1</button><button type="button" data-add-value="2">+2</button><button type="button" data-add-value="3">+3</button>
            </div></div>
          </div>
          <div class="booster-slot edge-slot">
            <label class="field edge-field"><span>エッジブースター</span><select id="edgeBooster"></select></label>
            <div class="booster-value-field"><div class="segmented booster-value-buttons" id="edgeValueButtons">
              <button type="button" data-edge-value="6">+6</button>
            </div></div>
          </div>
        </div>
      </div>
    </section>

    <section class="panel allocation-panel">
      <div class="section-head">
        <div>
          <h2>能力配分</h2>
        </div>
        <div class="points-box">
          <span>残りポイント</span>
          <strong id="remainingPoints">0 / 0</strong>
        </div>
      </div>
      <div id="groupGrid" class="group-grid"></div>
    </section>

    <section class="panel stats-panel">
      <div class="section-head">
        <div>
          <h2>最終能力値</h2>
          <p>タレントデザイン → 選手側ブースター → 上限処理 → 監督適性 → 監督ブースターの順で計算。</p>
        </div>
      </div>
      <div id="statsGrid" class="stats-grid"></div>
    </section>

    <section class="panel csv-panel">
      <div class="section-head">
        <div>
          <h2>選手データ管理</h2>
          <p>CSVは1行＝1選手カード。読み込み時に必須項目・数値形式・範囲を検証します。</p>
        </div>
      </div>
      <div class="csv-actions">
        <label class="file-btn">
          CSVを読み込む
          <input id="csvInput" type="file" accept=".csv,text/csv">
        </label>
        <button id="reloadDataBtn" class="secondary-btn">外部データを再読込</button>
      </div>
      <div id="dataStatus" class="data-status"></div>
    </section>
  </main>

  <footer>静的Webアプリ / HTML + CSS + JavaScript / データ分離設計 / v1.1</footer>

  <script src="config.js"></script>
  <script src="script.js"></script>
</body>
</html>
